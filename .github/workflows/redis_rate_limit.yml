name: GuardianAI Redis Rate Limiter tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'guardian/guardrails/rate_limiter.py'
      - 'tests/guardrails/test_rate_limiter.py'

jobs:
  test_redis_lua:
    runs-on: ubuntu-latest

    # Authoritative component test against a real Redis instance
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest redis httpx

      - name: Reinstall project packages
        run: |
          # If guardian needs itself installed
          pip install -e . || echo "No setup.py, assuming local imports"

      - name: Run Redis Lua Pytest validation 
        env:
          TEST_REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: |
          pytest tests/guardrails/test_rate_limiter.py -v
