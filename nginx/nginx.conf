events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Limit Request Size to prevent DDoS
    client_max_body_size 10M;

    upstream guardian_proxy {
        server guardian_stack:8081;
    }

    upstream guardian_dashboard {
        server guardian_stack:8001;
    }

    server {
        listen 80;
        server_name _;
        
        # In a real deployment with Let's Encrypt, redirect HTTP to HTTPS
        # return 301 https://$host$request_uri;

        # -------------------------------------
        # Route 1: GuardianAI Security Proxy
        # -------------------------------------
        location /v1/ {
            proxy_pass http://guardian_proxy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for streaming LLM responses
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # -------------------------------------
        # Route 2: SaaS Dashboard & Telemetry
        # -------------------------------------
        location / {
            proxy_pass http://guardian_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

