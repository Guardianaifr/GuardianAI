<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1120" width="1160" height="1120" style="background:#f8f9fa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.04"/>
    </filter>
    
    <!-- Arrow markers -->
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e03131" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b8a3e" />
    </marker>
  </defs>

  <!-- Main Canvas Card -->
  <rect x="30" y="30" width="1100" height="1060" rx="24" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="url(#card-shadow)" />

  <!-- Header Section -->
  <g text-anchor="middle">
    <text x="580" y="90" font-size="34" font-weight="800" fill="#c92a2a" letter-spacing="-0.5">The leak flows the other way</text>
    <text x="580" y="125" font-size="16" font-weight="500" fill="#6c757d">Why Inbound Firewalls Aren't Enough: Real-Time Outbound AI Egress Protection &amp; DLP</text>
  </g>

  <!-- ================= LEFT COLUMN: WITHOUT GUARDIANAI ================= -->
  <g transform="translate(60, 160)">
    <!-- Column Background Card -->
    <rect x="0" y="0" width="480" height="740" rx="18" fill="#fff5f5" stroke="#ffc9c9" stroke-width="2" />
    
    <!-- Column Header -->
    <rect x="25" y="20" width="430" height="56" rx="12" fill="#ffe3e3" />
    <text x="240" y="47" font-size="22" font-weight="700" fill="#c92a2a" text-anchor="middle">Without GuardianAI</text>
    <text x="240" y="66" font-size="12" font-weight="600" fill="#e03131" text-anchor="middle">⚠️ UNPROTECTED OUTPUT PIPELINE</text>

    <!-- Step 1: Customer PII in Reply -->
    <rect x="40" y="105" width="400" height="85" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5" filter="url(#soft-shadow)" />
    <text x="240" y="138" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">1. Customer PII / Secrets in LLM Reply</text>
    <text x="240" y="165" font-size="13" fill="#6c757d" text-anchor="middle">Names, credit cards, emails, internal API tokens, passwords</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="240" y1="190" x2="240" y2="245" stroke="#e03131" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />

    <!-- Step 2: Leaves proxy unwatched -->
    <rect x="40" y="255" width="400" height="85" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5" filter="url(#soft-shadow)" />
    <text x="240" y="288" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">2. Leaves Proxy Unwatched &amp; Unfiltered</text>
    <text x="240" y="315" font-size="13" fill="#6c757d" text-anchor="middle">Standard gateways only inspect inbound user prompts</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="240" y1="340" x2="240" y2="395" stroke="#e03131" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />

    <!-- Step 3: Lands on 3rd party servers -->
    <rect x="40" y="405" width="400" height="85" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5" filter="url(#soft-shadow)" />
    <text x="240" y="438" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">3. Lands on Third-Party Servers</text>
    <text x="240" y="465" font-size="13" fill="#6c757d" text-anchor="middle">Stored in browser cache, 3rd-party SaaS, logs, telemetry</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="240" y1="490" x2="240" y2="545" stroke="#c92a2a" stroke-width="4" marker-end="url(#arrow-red)" />

    <!-- Step 4: Permanent Leak Banner -->
    <rect x="40" y="555" width="400" height="65" rx="12" fill="#c92a2a" />
    <text x="240" y="595" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">🚨 PERMANENT DATA LEAK</text>

    <!-- Real-World Incident Case Study -->
    <rect x="30" y="640" width="420" height="75" rx="10" fill="#fff0f0" stroke="#ffa8a8" stroke-width="1.5" />
    <text x="240" y="663" font-size="13" font-weight="700" fill="#c92a2a" text-anchor="middle">📌 Real-World Incident: Samsung (2023)</text>
    <text x="240" y="683" font-size="12" fill="#862e9c" text-anchor="middle">3 separate IP leaks in 20 days (source code &amp; meeting notes)</text>
    <text x="240" y="701" font-size="11.5" fill="#495057" text-anchor="middle">Resulted in complete internal LLM ban &amp; regulatory scrutiny</text>
  </g>

  <!-- ================= RIGHT COLUMN: WITH GUARDIANAI ================= -->
  <g transform="translate(620, 160)">
    <!-- Column Background Card -->
    <rect x="0" y="0" width="480" height="740" rx="18" fill="#ebfbee" stroke="#b2f2bb" stroke-width="2" />
    
    <!-- Column Header -->
    <rect x="25" y="20" width="430" height="56" rx="12" fill="#d3f9d8" />
    <text x="240" y="47" font-size="22" font-weight="700" fill="#2b8a3e" text-anchor="middle">With GuardianAI</text>
    <text x="240" y="66" font-size="12" font-weight="600" fill="#2f9e44" text-anchor="middle">🛡️ REAL-TIME INLINE OUTPUT REDACTION</text>

    <!-- Step 1: Same Reply arrives -->
    <rect x="40" y="105" width="400" height="60" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5" filter="url(#soft-shadow)" />
    <text x="240" y="141" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">1. LLM Generates Response Payload</text>

    <!-- Arrow 1 -> GuardianAI Box -->
    <line x1="240" y1="165" x2="240" y2="195" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- GuardianAI Inline Redaction Engine Card -->
    <rect x="30" y="205" width="420" height="310" rx="14" fill="#ffffff" stroke="#2b8a3e" stroke-width="2.5" filter="url(#soft-shadow)" />
    
    <rect x="45" y="218" width="390" height="36" rx="8" fill="#e6fcf5" />
    <text x="240" y="242" font-size="14" font-weight="700" fill="#0ca678" text-anchor="middle">⚡ GuardianAI Inline Redaction Proxy (&lt; 5ms)</text>

    <!-- Redaction Item 1 -->
    <rect x="50" y="265" width="380" height="42" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1" />
    <text x="70" y="291" font-size="14" font-family="Courier, monospace" font-weight="700" fill="#2b8a3e">[REDACTED_EMAIL]</text>
    <text x="410" y="291" font-size="12" fill="#495057" text-anchor="end">Regex + NER Masking</text>

    <!-- Redaction Item 2 -->
    <rect x="50" y="315" width="380" height="42" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1" />
    <text x="70" y="341" font-size="14" font-family="Courier, monospace" font-weight="700" fill="#2b8a3e">[REDACTED_PHONE]</text>
    <text x="410" y="341" font-size="12" fill="#495057" text-anchor="end">Format &amp; Country Validated</text>

    <!-- Redaction Item 3 -->
    <rect x="50" y="365" width="380" height="42" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1" />
    <text x="70" y="391" font-size="14" font-family="Courier, monospace" font-weight="700" fill="#0ca678">API Keys &amp; Tokens</text>
    <text x="410" y="391" font-size="12" fill="#495057" text-anchor="end">High Entropy Detection</text>

    <!-- Redaction Item 4 -->
    <rect x="50" y="415" width="380" height="42" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1" />
    <text x="70" y="441" font-size="14" font-family="Courier, monospace" font-weight="700" fill="#0ca678">Credit Cards / SSN</text>
    <text x="410" y="441" font-size="12" fill="#495057" text-anchor="end">Luhn Algorithm Verified</text>

    <text x="240" y="495" font-size="12.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">✓ Stream-Redacted Before Packets Leave Proxy</text>

    <!-- Arrow GuardianAI -> Zero Boundary -->
    <line x1="240" y1="515" x2="240" y2="545" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- Step 3: Never Crosses Boundary Banner -->
    <rect x="40" y="555" width="400" height="65" rx="12" fill="#2b8a3e" />
    <text x="240" y="595" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">🛡️ ZERO DATA CROSSES BOUNDARY</text>

    <!-- Architecture & Compliance Note -->
    <rect x="30" y="640" width="420" height="75" rx="10" fill="#f4fce3" stroke="#b2f2bb" stroke-width="1.5" />
    <text x="240" y="663" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle">✓ Enterprise Compliance &amp; Audit Ready</text>
    <text x="240" y="683" font-size="12" fill="#2f9e44" text-anchor="middle">Inline token sanitization with sub-5ms proxy overhead</text>
    <text x="240" y="701" font-size="11.5" fill="#495057" text-anchor="middle">Guarantees GDPR, HIPAA, SOC 2 &amp; PCI-DSS compliance</text>
  </g>

  <!-- ================= BOTTOM SUMMARY BANNER ================= -->
  <g transform="translate(60, 930)">
    <rect x="0" y="0" width="1040" height="110" rx="16" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2" />
    <text x="520" y="44" font-size="24" font-weight="800" fill="#1864ab" text-anchor="middle">
      "Input firewalls stop attacks. Output scanning stops accidents."
    </text>
    <text x="520" y="74" font-size="15" font-weight="500" fill="#495057" text-anchor="middle">
      Input guards defend against prompt injections &amp; jailbreaks • Output scanners prevent catastrophic data leaks &amp; compliance violations
    </text>
    <text x="520" y="96" font-size="13" font-weight="600" fill="#1971c2" text-anchor="middle">
      GuardianAI provides end-to-end bidirectional security for Enterprise LLMs
    </text>
  </g>
</svg>