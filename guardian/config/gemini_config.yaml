app_name: "GuardianAI [Gemini Frontier Shield]"
version: "3.2.0"
guardian_id: "shield-gemini-frontier"

security_policies:
  block_prompt_injection: true
  validate_output: true
  security_mode: "strict" # 0.45 threshold
  show_block_reason: true
  leak_prevention_strategy: "block" # Block leaks for Cloud APIs
  admin_token: "change_me_to_secure_gemini_token"

scanner:
  skills_directory: "./skills"
  blocked_imports: [os, subprocess, sys, shutil]
  blocked_functions: [eval, exec, compile]

runtime_monitoring:
  blocked_processes:
    - nc.exe
    - ncat.exe
    - powershell.exe
    - cmd.exe
    - bash
  max_cpu_percent: 95.0
  max_memory_percent: 90.0
  check_interval_seconds: 5

proxy:
  enabled: true
  listen_port: 8085               # Dedicated Port for Gemini Shield
  target_url: "https://generativelanguage.googleapis.com" # Google Gemini API Endpoint
  upstream_key: "change_me_gemini_api_key" # Injected securely into x-goog-api-key / Authorization
  enforce_auth: true
  proxy_token: ""

supported_models:
  - "gemini-3.7-flash"
  - "gemini-3.7-pro"
  - "gemini-3.0-pro"
  - "gemini-2.5-flash"
  - "gemini-2.0-flash"
  - "gemini-2.0-pro-exp"

backend:
  enabled: true
  url: "http://127.0.0.1:8001/api/v1/telemetry"

rate_limiting:
  enabled: true
  requests_per_minute: 120

threat_feed:
  enabled: true
  feed_update_interval_minutes: 60
