services:
  # ----------------------------------------------------
  # GuardianAI Enterprise Stack (Unified Proxy + SaaS API)
  # ----------------------------------------------------
  guardian_stack:
    build: .
    container_name: guardian_enterprise_stack
    restart: unless-stopped
    ports:
      - "8001:8001" # SaaS Dashboard & Telemetry API
      - "8081:8081" # Universal Security Proxy
    environment:
      # Administrative Credentials
      - GUARDIAN_ADMIN_USER=${GUARDIAN_ADMIN_USER:-admin}
      - GUARDIAN_ADMIN_PASS=${GUARDIAN_ADMIN_PASS:?GUARDIAN_ADMIN_PASS must be set}
      
      # Database Persistence
      - GUARDIAN_DB_PATH=${GUARDIAN_DB_PATH:-/app/data/guardian.db}
      
      # Routing
      - TARGET_URL=${TARGET_URL:-http://host.docker.internal:8080}
      - GUARDIAN_PROXY_HOST=${GUARDIAN_PROXY_HOST:-0.0.0.0}
      
      # Rate Limiting & Metering
      - GUARDIAN_RATE_LIMIT_BACKEND=redis
      - GUARDIAN_RATE_LIMIT_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@guardian_redis:6379/0
      
      # Billing & DRM Licensing (Set these in production .env)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - GUARDIAN_LICENSE_KEY=${GUARDIAN_LICENSE_KEY:-}
      
      # Cryptographic Integrity Keys (Auto-generated if blank)
      - GUARDIAN_JWT_SECRET=${GUARDIAN_JWT_SECRET:-}
      - GUARDIAN_EVIDENCE_SIGNING_KEY=${GUARDIAN_EVIDENCE_SIGNING_KEY:-}
    volumes:
      # Persistent Databases & Metrics
      - ./guardian_data:/app/data
      # Cryptographic Evidence & Allow/Block lists
      - ./artifacts:/app/artifacts
    depends_on:
      - guardian_redis

  # ----------------------------------------------------
  # Redis Cache (For Distributed Token-Bucket Rate Limiting)
  # ----------------------------------------------------
  guardian_redis:
    image: redis:7-alpine
    container_name: guardian_redis
    restart: unless-stopped
    ports:
      # Only expose to localhost for security
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

volumes:
  redis_data:
