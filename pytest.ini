[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --ignore=result --ignore-glob=*.txt --ignore-glob=*.log --cov=guardian --cov-report=html --cov-report=term-missing
testpaths = tests
markers =
    e2e: Full end-to-end stack tests (proxy + backend + upstream). Run in isolation for best results.

[coverage:run]
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    pass
