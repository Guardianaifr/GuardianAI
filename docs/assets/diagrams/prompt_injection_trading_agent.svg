<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1060" width="1020" height="1060" style="background:#f8f9fa; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e03131" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b8a3e" />
    </marker>
  </defs>

  <!-- Main Card -->
  <rect x="20" y="20" width="980" height="1020" rx="20" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="url(#card-shadow)" />

  <!-- Header Badge -->
  <rect x="60" y="50" width="220" height="28" rx="14" fill="#e7f5ff" />
  <text x="170" y="69" font-size="12" font-weight="700" fill="#1864ab" text-anchor="middle" letter-spacing="0.5">AGENTIC AI SECURITY · 1 / 12</text>

  <!-- Header -->
  <text x="60" y="115" font-size="34" font-weight="800" fill="#212529">Prompt Injection vs GuardianAI</text>
  <text x="60" y="145" font-size="17" font-weight="500" fill="#868e96">When Text Becomes Commands: The $150K Trading Agent Drain</text>

  <!-- ================= WITHOUT GUARDIANAI ================= -->
  <text x="60" y="195" font-size="18" font-weight="800" fill="#e03131" letter-spacing="0.5">WITHOUT GUARDIANAI</text>

  <!-- Injected Phishing Box -->
  <rect x="60" y="220" width="250" height="120" rx="12" fill="#fff5f5" stroke="#fa5252" stroke-width="2" />
  <text x="185" y="258" font-size="15" font-weight="800" fill="#c92a2a" text-anchor="middle">INDIRECT ATTACK</text>
  <text x="185" y="284" font-size="12.5" fill="#e03131" text-anchor="middle">Gifted NFT · Morse X reply</text>
  <text x="185" y="306" font-size="12.5" fill="#e03131" text-anchor="middle">Decoded in context window</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="310" y1="280" x2="360" y2="280" stroke="#e03131" stroke-width="3" marker-end="url(#arrow-red)" />

  <!-- AI Keyholder Agent Box -->
  <rect x="375" y="220" width="250" height="120" rx="12" fill="#ffffff" stroke="#212529" stroke-width="2" />
  <text x="500" y="258" font-size="15" font-weight="800" fill="#212529" text-anchor="middle">AI TRADING AGENT</text>
  <text x="500" y="284" font-size="12.5" fill="#495057" text-anchor="middle">Reads text as commands</text>
  <text x="500" y="306" font-size="12.5" font-family="Courier, monospace" font-weight="700" fill="#c92a2a" text-anchor="middle">transfer(3_000_000_000)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="625" y1="280" x2="675" y2="280" stroke="#e03131" stroke-width="3" marker-end="url(#arrow-red)" />

  <!-- Treasury Drained Box -->
  <rect x="690" y="220" width="260" height="120" rx="12" fill="#ffe3e3" stroke="#e03131" stroke-width="2.5" />
  <text x="820" y="260" font-size="17" font-weight="900" fill="#c92a2a" text-anchor="middle">WALLET DRAINED</text>
  <text x="820" y="288" font-size="14.5" font-weight="800" fill="#e03131" text-anchor="middle">~$150K · 3B tokens gone</text>
  <text x="820" y="310" font-size="11.5" fill="#862e9c" text-anchor="middle">1 tx · 0 malware · 0 key theft</text>

  <!-- ================= WITH GUARDIANAI ================= -->
  <text x="60" y="395" font-size="18" font-weight="800" fill="#2b8a3e" letter-spacing="0.5">WITH GUARDIANAI</text>

  <!-- Same Attack Box -->
  <rect x="60" y="420" width="245" height="180" rx="12" fill="#fff5f5" stroke="#fa5252" stroke-width="2" />
  <text x="182" y="485" font-size="16" font-weight="800" fill="#c92a2a" text-anchor="middle">SAME ATTACK</text>
  <text x="182" y="515" font-size="13.5" fill="#e03131" text-anchor="middle">NFT + Morse payload</text>
  <text x="182" y="538" font-size="13.5" fill="#e03131" text-anchor="middle">Same trading agent</text>

  <!-- Green Arrow to Firewall -->
  <line x1="305" y1="510" x2="355" y2="510" stroke="#2b8a3e" stroke-width="3.5" marker-end="url(#arrow-green)" />

  <!-- GuardianAI Trust Guard Box -->
  <rect x="370" y="405" width="285" height="210" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5" />
  <text x="512" y="442" font-size="15.5" font-weight="900" fill="#2b8a3e" text-anchor="middle">GUARDIANAI FIREWALL</text>
  
  <text x="395" y="480" font-size="13.5" font-weight="700" fill="#212529">1 <tspan font-weight="500"> Regex filter (&lt;1ms latency)</tspan></text>
  <text x="395" y="512" font-size="13.5" font-weight="700" fill="#212529">2 <tspan font-weight="500"> Semantic jailbreak detection</tspan></text>
  <text x="395" y="544" font-size="13.5" font-weight="700" fill="#212529">3 <tspan font-weight="500"> Tool-abuse &amp; drain guard</tspan></text>
  
  <text x="512" y="585" font-size="12" fill="#495057" text-anchor="middle">(Edge Inspection Boundary)</text>

  <!-- Output 1: Blocked HTTP 403 -->
  <line x1="655" y1="475" x2="705" y2="455" stroke="#e03131" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />
  <rect x="715" y="415" width="245" height="90" rx="12" fill="#ffe3e3" stroke="#e03131" stroke-width="2" />
  <text x="837" y="452" font-size="15" font-weight="800" fill="#c92a2a" text-anchor="middle">ATTACK → HTTP 403</text>
  <text x="837" y="478" font-size="12" fill="#e03131" text-anchor="middle">Hostile instructions die at edge</text>

  <!-- Output 2: Safe Treasury -->
  <line x1="655" y1="545" x2="705" y2="565" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="715" y="525" width="245" height="90" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2" />
  <text x="837" y="562" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="middle">BENIGN PASSES</text>
  <text x="837" y="588" font-size="12" font-weight="600" fill="#2f9e44" text-anchor="middle">$150K Intact · 0.0% False Positives</text>

  <!-- Fail-closed caption -->
  <text x="500" y="670" font-size="14.5" font-style="italic" fill="#495057" text-anchor="middle">Without it, you're trusting a polite request as your security policy. With it, hostile instructions die at the edge.</text>

  <!-- Divider -->
  <line x1="60" y1="720" x2="960" y2="720" stroke="#dee2e6" stroke-width="1.5" />

  <!-- Benchmark stats -->
  <text x="500" y="775" font-size="15.5" font-weight="600" fill="#495057" text-anchor="middle">
    <tspan font-weight="800" fill="#212529">97.6%</tspan> strict-gate block rate (949/972)   ·   <tspan font-weight="800" fill="#212529">p95</tspan> under attack 41.88 ms   ·   Zero False Positives
  </text>

  <!-- CTA -->
  <text x="500" y="875" font-size="30" font-weight="800" fill="#212529" text-anchor="middle">One command. Run it yourself.</text>
</svg>