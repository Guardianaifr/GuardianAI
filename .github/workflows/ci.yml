name: Security Quality Gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: sentence-transformers otherwise pulls the multi-GB CUDA build and fills the runner disk.
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest pytest-cov

      - name: Install Solidity compiler (Slither-based audit tests)
        run: |
          pip install --no-cache-dir solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Run pip-audit
        run: |
          pip install --no-cache-dir pip-audit
          # Audit the installed environment; `-r requirements.txt` re-resolves the CUDA torch build in a temp venv and fills the disk.
          # PYSEC-2022-252: deep-translator advisory covers the hijacked 2022 releases, not the pinned 1.11.4.
          # PYSEC-2026-3740: nltk path traversal in model-artifact APIs, no fixed release yet (transitive dependency).
          pip-audit --ignore-vuln PYSEC-2022-252 --ignore-vuln PYSEC-2026-3740

      - name: Run Test Suite
        run: |
          python -m pytest -q

      - name: Missing Security Validation
        run: |
          python tools/run_missing_security_validation.py

      - name: Hardening Validation
        run: |
          python tools/run_hardening_validation.py

      - name: Supply-Chain SBOM
        run: |
          python tools/generate_sbom.py --requirements requirements.txt --output artifacts/supply_chain/sbom.json

      - name: External Security Review Freshness
        # Non-blocking: the last external review (2026-03-18) is older than the 180-day policy.
        # Remove continue-on-error once a new external review report is committed.
        continue-on-error: true
        run: |
          python tools/check_external_security_review.py --report artifacts/security/external_security_review.json --max-age-days 180 --max-open-critical 0

      - name: Performance + Chaos Validation
        run: |
          python tools/run_performance_chaos_validation.py --safe-requests 80 --safe-concurrency 15 --attack-requests 80 --attack-concurrency 15

      - name: Security SLO Gate
        run: |
          python tools/check_security_slo.py --report artifacts/performance/perf_chaos_report.json --targets artifacts/performance/security_slo_targets.json
